name: Inspect Aeroletopis release payload

on:
  push:
    branches:
      - feature/knastu-sj100-airbattle
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Decode and inspect implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, re

          order = [
              "kr-01a","kr-01b","kr-02","kr-03",
              "kr-04q1","kr-04q2","kr-04q3","kr-04q4","kr-04b",
              "kr-05a","kr-05b","kr-06a","kr-06b",
              "kr-07q1","kr-07q2","kr-07q3","kr-07q4","kr-07b",
              "kr-08q1","kr-08q2","kr-08q3","kr-08q4","kr-08b"
          ]
          raw = "".join(Path("site", name + ".b64").read_text(encoding="utf-8").strip() for name in order)
          html = gzip.decompress(base64.b64decode(raw, validate=True)).decode("utf-8")

          def dump(label, start, end=None, limit=9000):
              print("\\n===== " + label + " =====")
              if start < 0:
                  print("NOT FOUND")
                  return
              end = len(html) if end is None or end < 0 else end
              value = html[start:end]
              print(value[:limit])
              if len(value) > limit:
                  print("...TRUNCATED", len(value)-limit, "CHARS")

          c = html.find('id="centersModule"')
          b = html.find('id="battleModule"')
          dump("CENTERS SECTION", c, b, 9000)

          for term, limit in [
              ("const AIRCRAFT", 7000),
              ("const BATTLE_STATS", 5000),
              ("const BATTLE_SPRITES", 5000),
              ("const battle=", 2500),
              ("function battleLoad", 6000),
              ("function battleCreateBullet", 4000),
              ("function battleDraw", 8000),
              ("function battleUpdate", 8000),
              ("function battleStart", 4000),
              ("function battleLoop", 5000),
          ]:
              i = html.find(term)
              dump(term, i, i+limit if i >= 0 else -1, limit)

          print("\\n===== RELEVANT DECLARATIONS =====")
          for m in re.finditer(r'(?:const|let|var|function)\\s+([A-Za-z_$][\\w$]*)', html):
              name = m.group(1)
              if any(k in name.lower() for k in ("aircraft","hangar","battle","sprite","center")):
                  print(m.start(), name)
          PY
