name: Inspect Aeroletopis release payload

on:
  push:
    branches:
      - feature/knastu-sj100-airbattle
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Print exact game functions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,gzip,re
          order=["kr-01a","kr-01b","kr-02","kr-03","kr-04q1","kr-04q2","kr-04q3","kr-04q4","kr-04b","kr-05a","kr-05b","kr-06a","kr-06b","kr-07q1","kr-07q2","kr-07q3","kr-07q4","kr-07b","kr-08q1","kr-08q2","kr-08q3","kr-08q4","kr-08b"]
          raw="".join(Path("site",n+".b64").read_text().strip() for n in order)
          h=gzip.decompress(base64.b64decode(raw)).decode()
          for term in ["function battleRenderSelection","function battleDraw(ctx","function battleDraw()","function battleDrawBullet","function battleDrawTank","function battleMove","function renderAircraft","const SOURCES","const SOURCE","function openId"]:
              i=h.find(term)
              print("\\n###",term,i)
              if i>=0: print(h[i:i+4500])
          print("\\n### HANGAR/ARCHIVE TERMS")
          for m in re.finditer("ангар|hangar",h,re.I):
              print(m.start(),h[max(0,m.start()-200):m.start()+500])
          PY
