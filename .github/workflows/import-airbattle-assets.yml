name: Import Air Battle PNG assets

on:
  push:
    branches:
      - feature/knastu-sj100-airbattle
    paths:
      - "site.zip"

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/knastu-sj100-airbattle

      - name: Validate and extract supplied sprite archive
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f site.zip ]; then
            echo "No site.zip upload to process."
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import struct, zipfile

          archive = Path("site.zip")
          root = Path(".")
          expected = {
              "site/assets/air-battle/aircraft/il-2.png",
              "site/assets/air-battle/aircraft/mig-29.png",
              "site/assets/air-battle/aircraft/mig-31.png",
              "site/assets/air-battle/aircraft/su-25.png",
              "site/assets/air-battle/aircraft/su-27.png",
              "site/assets/air-battle/aircraft/su-34.png",
              "site/assets/air-battle/aircraft/su-35.png",
              "site/assets/air-battle/aircraft/su-57.png",
              "site/assets/air-battle/aircraft/yak-3.png",
              "site/assets/air-battle/effects/bullet.png",
              "site/assets/air-battle/effects/drone.png",
              "site/assets/air-battle/effects/explosion.png",
              "site/assets/air-battle/effects/tank.png",
              "site/assets/air-battle/powerups/damage.png",
              "site/assets/air-battle/powerups/fire-rate.png",
              "site/assets/air-battle/powerups/triple.png",
          }
          with zipfile.ZipFile(archive) as z:
              members = {n for n in z.namelist() if n.lower().endswith(".png")}
              if members != expected:
                  missing = sorted(expected - members)
                  extra = sorted(members - expected)
                  raise SystemExit(f"Archive contents mismatch. Missing={missing}; extra={extra}")
              for name in sorted(expected):
                  p = PurePosixPath(name)
                  if p.is_absolute() or ".." in p.parts:
                      raise SystemExit(f"Unsafe archive path: {name}")
                  data = z.read(name)
                  if len(data) < 33 or data[:8] != b"\\x89PNG\\r\\n\\x1a\\n":
                      raise SystemExit(f"Invalid PNG: {name}")
                  width, height = struct.unpack(">II", data[16:24])
                  if (width, height) != (512, 512):
                      raise SystemExit(f"Unexpected dimensions for {name}: {width}x{height}")
                  target = root.joinpath(*p.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
          archive.unlink()
          print(f"Imported and validated {len(expected)} transparent PNG asset files.")
          PY

      - name: Commit imported images to the feature branch
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "No imported assets to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/assets/air-battle site.zip
          git commit -m "assets: add Air Battle PNG sprites"
          git push origin HEAD:feature/knastu-sj100-airbattle
