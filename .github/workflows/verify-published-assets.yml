name: Verify Air Battle Pages assets
on:
  push:
    branches:
      - feature/knastu-sj100-airbattle
    paths:
      - .github/workflows/verify-published-assets.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release payload and published asset paths
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, shutil, struct, re

          order=["kr-01a","kr-01b","kr-02","kr-03","kr-04q1","kr-04q2","kr-04q3","kr-04q4","kr-04b","kr-05a","kr-05b","kr-06a","kr-06b","kr-07q1","kr-07q2","kr-07q3","kr-07q4","kr-07b","kr-08q1","kr-08q2","kr-08q3","kr-08q4","kr-08b"]
          encoded="".join(Path("site",n+".b64").read_text().strip() for n in order)
          html=gzip.decompress(base64.b64decode(encoded,validate=True)).decode("utf-8")

          expected=[
            "aircraft/il-2.png","aircraft/yak-3.png","aircraft/mig-29.png",
            "aircraft/mig-31.png","aircraft/su-25.png","aircraft/su-27.png",
            "aircraft/su-34.png","aircraft/su-35.png","aircraft/su-57.png",
            "effects/bullet.png","effects/drone.png","effects/explosion.png","effects/tank.png",
            "powerups/triple.png","powerups/damage.png","powerups/fire-rate.png"
          ]
          source=Path("site/assets/air-battle")
          for rel in expected:
              data=(source/rel).read_bytes()
              if data[:8]!=bytes((137,80,78,71,13,10,26,10)):
                  raise SystemExit(f"Invalid source image: {rel}")
              w,h=struct.unpack(">II",data[16:24])
              if (w,h)!=(512,512) or data[25] not in (4,6):
                  raise SystemExit(f"Image size/transparency check failed: {rel}")

          # Mirror the exact copy step inserted into deploy.yml.
          dist=Path("dist")
          dist.mkdir(exist_ok=True)
          shutil.copytree("site/assets",dist/"assets",dirs_exist_ok=True)
          copied=[p for p in (dist/"assets/air-battle").rglob("*.png")]
          if len(copied)!=16:
              raise SystemExit(f"Expected 16 PNGs in dist/assets, found {len(copied)}")

          for rel in ["air-battle/aircraft/mig-31.png","air-battle/aircraft/su-25.png"]:
              if not (dist/"assets"/rel).is_file():
                  raise SystemExit(f"New aircraft card path missing from deployed output: {rel}")
              if f'image:"assets/{rel}"' not in html:
                  raise SystemExit(f"Catalog does not reference the intended image: assets/{rel}")

          embedded=html.count("data:image/png;base64,")
          if embedded!=16:
              raise SystemExit(f"Expected 16 inline game image data URLs, found {embedded}")

          scripts=re.findall(r"<script\\b[^>]*>(.*?)</script\\s*>",html,re.I|re.S)
          Path("/tmp/aeroletopis-check.js").write_text("\\n;\\n".join(scripts),encoding="utf-8")
          if "ЗАГРУЗКА РЕЛИЗА V24" not in Path("index.html").read_text(encoding="utf-8"):
              raise SystemExit("Outer loader is not labelled V24")
          print(f"Release payload decoded: {len(html):,} characters")
          print("Source PNGs: 16, all 512x512 with alpha")
          print(f"Published dist/assets copy: {len(copied)} PNGs")
          print(f"Inline Air Battle PNG data URLs: {embedded}")
          print("New catalog images: MiG-31 and Su-25 paths resolve")
          PY
      - name: Check embedded JavaScript syntax
        run: node --check /tmp/aeroletopis-check.js
