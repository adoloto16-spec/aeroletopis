name: Apply Air Battle PNG integration

on:
  push:
    branches:
      - feature/knastu-sj100-airbattle
    paths:
      - .github/workflows/apply-airbattle-assets.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/knastu-sj100-airbattle

      - name: Integrate supplied sprites and validate release
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, re, struct

          order = [
              "kr-01a","kr-01b","kr-02","kr-03",
              "kr-04q1","kr-04q2","kr-04q3","kr-04q4","kr-04b",
              "kr-05a","kr-05b","kr-06a","kr-06b",
              "kr-07q1","kr-07q2","kr-07q3","kr-07q4","kr-07b",
              "kr-08q1","kr-08q2","kr-08q3","kr-08q4","kr-08b"
          ]
          chunk_paths = [Path("site", name + ".b64") for name in order]
          old_chunks = [path.read_text(encoding="utf-8").strip() for path in chunk_paths]
          encoded = "".join(old_chunks)
          html = gzip.decompress(base64.b64decode(encoded, validate=True)).decode("utf-8")

          def replace_once(old, new, label):
              global html
              count = html.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one occurrence, found {count}")
              html = html.replace(old, new, 1)

          def replace_between(start, end, new, label):
              global html
              a = html.find(start)
              if a < 0:
                  raise SystemExit(f"{label}: start anchor not found: {start}")
              b = html.find(end, a + len(start))
              if b < 0:
                  raise SystemExit(f"{label}: end anchor not found: {end}")
              html = html[:a] + new + "\n" + html[b:]

          # New records point to sources appended after the current source list.
          sources_start = html.find("const SOURCES=[")
          sources_end = html.find("];", sources_start)
          if sources_start < 0 or sources_end < 0:
              raise SystemExit("SOURCES array not found")
          original_sources = html[sources_start:sources_end]
          source_count = original_sources.count("{title:")
          mig31_source = source_count
          su25_source = source_count + 1

          aircraft_start = html.find("const AIRCRAFT=[")
          aircraft_end = html.find("];", aircraft_start)
          if aircraft_start < 0 or aircraft_end < 0:
              raise SystemExit("AIRCRAFT catalog not found")
          catalog = html[aircraft_start:aircraft_end]

          new_aircraft = []
          if 'id:"mig-31"' not in catalog:
              new_aircraft.append(
                  '{id:"mig-31",name:"МиГ-31",year:1975,type:"дальний сверхзвуковой истребитель-перехватчик",group:"jet",era:"e7",designer:"ОКБ им. А. И. Микояна",short:"Дальний высотный перехватчик для защиты воздушных рубежей и перехвата скоростных воздушных целей.",details:"Прототип Е-155МП («83») впервые поднялся в воздух 16 сентября 1975 года под управлением лётчика-испытателя А. В. Федотова. МиГ-31 продолжил развитие советской линии дальних перехватчиков; позднее самолёт проходил модернизации.",features:["первый полёт 16 сентября 1975 года","дальний перехват","2 двигателя","экипаж 2 человека"],significance:"Представляет отдельную линию дальних перехватчиков и отличается по задачам и размерности от фронтовых истребителей.",image:"assets/air-battle/aircraft/mig-31.png",sources:[' + str(mig31_source) + ']}'
              )
          if 'id:"su-25"' not in catalog:
              new_aircraft.append(
                  '{id:"su-25",name:"Су-25",year:1975,type:"бронированный дозвуковой штурмовик",group:"jet",era:"e7",designer:"ОКБ П. О. Сухого",short:"Штурмовик непосредственной поддержки сухопутных войск с усиленной защитой пилота и жизненно важных систем.",details:"Первый опытный Су-25 поднялся в воздух 22 февраля 1975 года. Самолёт создавался для непосредственной поддержки войск над линией фронта; его концепция предусматривала бронирование кабины и важных узлов, а также меры повышения боевой живучести.",features:["первый полёт 22 февраля 1975 года","дозвуковой штурмовик","бронезащита","непосредственная поддержка войск"],significance:"Показывает отдельное направление развития боевой авиации — специализированные штурмовики для работы вблизи линии фронта.",image:"assets/air-battle/aircraft/su-25.png",sources:[' + str(su25_source) + ']}'
              )
          if new_aircraft:
              marker = '{id:"su-27",name:"Су-27 / Т-10"'
              insert_at = html.find(marker, aircraft_start, aircraft_end)
              if insert_at < 0:
                  raise SystemExit("Cannot place MiG-31 and Su-25 before the Su-27 catalog entry")
              html = html[:insert_at] + ",".join(new_aircraft) + "," + html[insert_at:]

          # Append sourced references without changing any existing source indices.
          sources_start = html.find("const SOURCES=[")
          sources_end = html.find("];", sources_start)
          sources_block = html[sources_start:sources_end]
          source_additions = []
          if "ОАК — 50 лет со дня первого полёта МиГ-31" not in sources_block:
              source_additions.append(
                  '{title:"ОАК — 50 лет со дня первого полёта МиГ-31",kind:"официальный отраслевой источник",note:"Дата первого полёта прототипа Е-155МП — 16 сентября 1975 года; лётчик-испытатель А. В. Федотов.",url:"https://uacrussia.ru/ru/press-center/events/?type=dates&year=2025"}'
              )
          if "Музей Победы — самолёт-штурмовик Су-25" not in sources_block:
              source_additions.append(
                  '{title:"Музей Победы — самолёт-штурмовик Су-25",kind:"музейный источник",note:"Первый полёт 22 февраля 1975 года, назначение штурмовика и особенности защиты.",url:"https://victorymuseum.ru/encyclopedia/technic/voenno-vozdushnye-sily/samolet-shturmovik-su-25-sssr/"}'
              )
          if source_additions:
              separator = "" if sources_block.rstrip().endswith(",") else ","
              html = html[:sources_end] + separator + "\n" + ",\n".join(source_additions) + html[sources_end:]

          # Replace game aircraft entries and balance profiles with the matching nine PNGs.
          battle_constants = r'''const BATTLE_ASSET_BASE="assets/air-battle/";
          const BATTLE_SPRITES={
            "il-2":{file:"aircraft/il-2.png"},
            "yak-3":{file:"aircraft/yak-3.png"},
            "mig-29":{file:"aircraft/mig-29.png"},
            "mig-31":{file:"aircraft/mig-31.png"},
            "su-25":{file:"aircraft/su-25.png"},
            "su-27":{file:"aircraft/su-27.png"},
            "su-34":{file:"aircraft/su-34.png"},
            "su-35":{file:"aircraft/su-35.png"},
            "su-57":{file:"aircraft/su-57.png"}
          };

          const BATTLE_STATS={
            "il-2":{title:"Ил-2",era:"1940-е",size:60,fire:440,damage:2.3,bullet:680,move:300,grade:"БРОНИРОВАННЫЙ ШТУРМОВИК"},
            "yak-3":{title:"Як-3",era:"1943–1945",size:63,fire:400,damage:2.7,bullet:700,move:315,grade:"ЛЁГКИЙ ИСТРЕБИТЕЛЬ"},
            "mig-29":{title:"МиГ-29",era:"1977",size:78,fire:235,damage:5.4,bullet:790,move:370,grade:"ФРОНТОВОЙ ИСТРЕБИТЕЛЬ"},
            "mig-31":{title:"МиГ-31",era:"1975",size:92,fire:175,damage:7.8,bullet:900,move:380,grade:"ДАЛЬНИЙ СВЕРХЗВУКОВОЙ ПЕРЕХВАТЧИК"},
            "su-25":{title:"Су-25",era:"1975",size:82,fire:220,damage:6.4,bullet:780,move:335,grade:"БРОНИРОВАННЫЙ ШТУРМОВИК"},
            "su-27":{title:"Су-27",era:"1977",size:82,fire:220,damage:6.0,bullet:800,move:380,grade:"ТЯЖЁЛЫЙ ИСТРЕБИТЕЛЬ"},
            "su-34":{title:"Су-34",era:"1990-е →",size:86,fire:205,damage:6.6,bullet:810,move:365,grade:"УДАРНЫЙ САМОЛЁТ"},
            "su-35":{title:"Су-35",era:"2008 →",size:91,fire:182,damage:7.4,bullet:830,move:395,grade:"МНОГОЦЕЛЕВОЙ ИСТРЕБИТЕЛЬ"},
            "su-57":{title:"Су-57",era:"2010-е →",size:98,fire:158,damage:8.8,bullet:860,move:420,grade:"МНОГОЦЕЛЕВОЙ ИСТРЕБИТЕЛЬ ПЯТОГО ПОКОЛЕНИЯ"}
          };'''
          replace_between("const BATTLE_SPRITES={", "function battleSafeBest()", battle_constants, "Battle aircraft and balance tables")
          html = html.replace("/* V13 BATTLE GAME */", "/* V24 BATTLE GAME — LOCAL TRANSPARENT PNG SPRITES */")

          image_loader = r'''function battleLoadThumbnail(canvas,id){
            if(!canvas||!canvas.getContext)return;
            const ctx=canvas.getContext("2d");
            if(!ctx)return;
            ctx.clearRect(0,0,canvas.width,canvas.height);
            const image=battle.images&&battle.images.aircraft?battle.images.aircraft[id]:null;
            if(image&&image.complete&&image.naturalWidth){
              const size=Math.min(canvas.width,canvas.height)*.9;
              ctx.drawImage(image,(canvas.width-size)/2,(canvas.height-size)/2,size,size);
            }else{
              ctx.fillStyle="rgba(219,226,216,.55)";
              ctx.font="10px system-ui";
              ctx.textAlign="center";
              ctx.textBaseline="middle";
              ctx.fillText("ЗАГРУЗКА",canvas.width/2,canvas.height/2);
            }
          }

          function battleLoadPlaneImage(){
            if(!battle.images||!battle.images.aircraft){
              battle.images={aircraft:{},effects:{},powerups:{}};
            }
            const manifest={
              aircraft:Object.fromEntries(Object.entries(BATTLE_SPRITES).map(([id,sprite])=>[id,sprite.file])),
              effects:{
                bullet:"effects/bullet.png",
                drone:"effects/drone.png",
                explosion:"effects/explosion.png",
                tank:"effects/tank.png"
              },
              powerups:{
                triple:"powerups/triple.png",
                damage:"powerups/damage.png",
                rapid:"powerups/fire-rate.png"
              }
            };
            for(const [group,items] of Object.entries(manifest)){
              for(const [id,path] of Object.entries(items)){
                if(battle.images[group][id])continue;
                const image=new Image();
                image.decoding="async";
                image.onload=()=>{
                  if(battle.field){
                    $$('[data-battle-icon]').forEach(canvas=>battleLoadThumbnail(canvas,canvas.dataset.battleIcon));
                    battleDraw();
                  }
                };
                image.onerror=()=>console.warn("Не удалось загрузить игровой спрайт:",path);
                image.src=BATTLE_ASSET_BASE+path;
                battle.images[group][id]=image;
              }
            }
          }

          function battleClearEntities(){
            battle.bullets.length=0;
            battle.tanks.length=0;
            battle.powerups.length=0;
            battle.drones.length=0;
            battle.explosions=[];
            battle.buffs={tripleUntil:0,damageUntil:0,rapidUntil:0};
          }'''
          replace_between("function battleLoadThumbnail(canvas,id){", "function battleSpawnTank(){", image_loader, "Sprite loader and entity reset")

          sprite_renderers = r'''function battleDrawSprite(ctx,image,x,y,width,height,rotation=0,alpha=1){
            if(!ctx||!image||!image.complete||!image.naturalWidth)return false;
            ctx.save();
            ctx.globalAlpha=alpha;
            ctx.translate(x,y);
            if(rotation)ctx.rotate(rotation);
            ctx.drawImage(image,-width/2,-height/2,width,height);
            ctx.restore();
            return true;
          }

          function battleDrawTank(ctx,t){
            const size=Math.max(58,t.size*1.42);
            const image=battle.images&&battle.images.effects?battle.images.effects.tank:null;
            if(!battleDrawSprite(ctx,image,t.x,t.y,size,size)){
              ctx.save();ctx.translate(t.x,t.y);ctx.fillStyle="#67746b";ctx.fillRect(-t.size/2,-t.size/2,t.size,t.size);ctx.restore();
            }
            ctx.save();
            ctx.fillStyle="rgba(0,0,0,.55)";
            ctx.fillRect(t.x-size*.38,t.y-size*.48,size*.76,5);
            ctx.fillStyle="#e3e8dc";
            ctx.fillRect(t.x-size*.38,t.y-size*.48,size*.76*Math.max(0,t.hp/t.maxHp),5);
            ctx.restore();
          }

          function battleDrawPlaneGlyph(ctx,id,x,y,size){
            const image=battle.images&&battle.images.aircraft?battle.images.aircraft[id]:null;
            const drawSize=size*1.2;
            if(!battleDrawSprite(ctx,image,x,y,drawSize,drawSize)){
              ctx.save();ctx.fillStyle="#d7dfd4";ctx.font="bold 22px system-ui";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("✈",x,y);ctx.restore();
            }
          }

          function battleDrawPlane(ctx){
            const {h}=battleCanvasSize(),meta=battleSelectedMeta();
            if(!meta)return;
            const s=meta.s.size,x=battle.playerX,y=h-s*.78;
            battleDrawPlaneGlyph(ctx,meta.a.id,x,y,s*1.08);
          }

          function battleDrawPowerup(ctx,p){
            const image=battle.images&&battle.images.powerups?battle.images.powerups[p.type]:null;
            const size=Math.max(44,p.r*2.9);
            if(!battleDrawSprite(ctx,image,p.x,p.y,size,size,Math.sin(performance.now()/420)*.035)){
              ctx.save();ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle="#a9cbb3";ctx.fill();ctx.restore();
            }
          }

          function battleDrawDrone(ctx,d){
            const image=battle.images&&battle.images.effects?battle.images.effects.drone:null;
            const size=Math.max(54,d.size*1.55);
            if(!battleDrawSprite(ctx,image,d.x,d.y,size,size,Math.sin(d.phase)*.08)){
              ctx.save();ctx.translate(d.x,d.y);ctx.fillStyle="#b8498c";ctx.beginPath();ctx.arc(0,0,d.r,0,Math.PI*2);ctx.fill();ctx.restore();
            }
          }

          function battleSpawnExplosion(x,y,size){
            if(!Array.isArray(battle.explosions))battle.explosions=[];
            battle.explosions.push({x,y,size:Math.max(42,size||52),startedAt:performance.now(),duration:680,rotation:Math.random()*Math.PI*2});
          }

          function battleDrawExplosion(ctx,e,now){
            const image=battle.images&&battle.images.effects?battle.images.effects.explosion:null;
            const progress=Math.min(1,Math.max(0,(now-e.startedAt)/e.duration));
            const size=e.size*(.62+progress*.72);
            battleDrawSprite(ctx,image,e.x,e.y,size,size,e.rotation,1-progress);
          }'''
          replace_between("function battleDrawTank(ctx,t){", "function battleDraw(ctx){", sprite_renderers, "PNG sprite rendering functions")

          new_draw = r'''function battleDraw(){
            const c=battle.canvas,ctx=battle.ctx;
            if(!c||!ctx)return;
            const {w,h}=battleCanvasSize(),now=performance.now();
            ctx.clearRect(0,0,w,h);
            battleDrawBackground(ctx,w,h);
            for(const t of battle.tanks)battleDrawTank(ctx,t);
            for(const d of battle.drones)battleDrawDrone(ctx,d);
            for(const p of battle.powerups)battleDrawPowerup(ctx,p);
            for(const e of (battle.explosions||[]))battleDrawExplosion(ctx,e,now);
            for(const b of battle.bullets){
              const image=battle.images&&battle.images.effects?battle.images.effects.bullet:null;
              const angle=Math.atan2(b.vx,-b.vy);
              if(!battleDrawSprite(ctx,image,b.x,b.y,Math.max(18,b.r*4.6),Math.max(24,b.r*6),angle)){
                ctx.fillStyle="#ffe28b";ctx.beginPath();ctx.arc(b.x,b.y,Math.max(2,b.r),0,Math.PI*2);ctx.fill();
              }
            }
            battleDrawPlane(ctx);
            battleUpdateHud();
          }'''
          replace_between("function battleDraw(){", "function battleUpdateHud()", new_draw, "Battle canvas composition")

          replace_once(
              'function battleDestroyTank(i){const t=battle.tanks[i];if(!t)return;battle.tanks.splice(i,1);',
              'function battleDestroyTank(i){const t=battle.tanks[i];if(!t)return;battleSpawnExplosion(t.x,t.y,t.size*1.5);battle.tanks.splice(i,1);',
              "Tank destruction effect"
          )
          replace_once(
              'battle.drones.splice(j,1);battle.bullets.splice(i,1);battle.score+=15;',
              'battle.drones.splice(j,1);battle.bullets.splice(i,1);battleSpawnExplosion(d.x,d.y,d.size*1.45);battle.score+=15;',
              "Drone destruction effect"
          )
          replace_once(
              'const now=performance.now(),step=dt/1000,playerY=h-meta.s.size*.78;',
              'const now=performance.now(),step=dt/1000,playerY=h-meta.s.size*.78;\n  battle.explosions=(battle.explosions||[]).filter(e=>now-e.startedAt<e.duration);',
              "Explosion lifetime update"
          )
          replace_once(
              'const d=battle.drones[i];d.y+=d.speed*step;d.x+=d.vx*step;',
              'const d=battle.drones[i];d.y+=d.speed*step;d.x+=d.vx*step;d.phase+=step*1.25;',
              "Drone sprite animation"
          )
          collision_pattern = r'if\(Math\.hypot\(d\.x-battle\.playerX,d\.y-playerY\)<d\.r\+meta\.s\.size\*\.31\)\{\s*battleGameOver\(\);return;\s*\}'
          html, collision_count = re.subn(
              collision_pattern,
              'if(Math.hypot(d.x-battle.playerX,d.y-playerY)<d.r+meta.s.size*.31){\n      battleSpawnExplosion(battle.playerX,playerY,meta.s.size*1.55);battleDraw();battleGameOver();return;\n    }',
              html,
              count=1
          )
          if collision_count != 1:
              raise SystemExit(f"Player/drone collision hook: expected one match, found {collision_count}")

          replace_once(
              'battleResizeCanvas();battleRenderSelection();battleLoadPlaneImage();battleDraw();',
              'battleResizeCanvas();battleLoadPlaneImage();battleRenderSelection();battleDraw();',
              "Initial image loading order"
          )

          # Keep the outer loader and deployed static resources in sync.
          index_path=Path("index.html")
          index_html=index_path.read_text(encoding="utf-8")
          index_html_new=index_html.replace("ЗАГРУЗКА РЕЛИЗА V23","ЗАГРУЗКА РЕЛИЗА V24")
          if index_html_new==index_html:
              raise SystemExit("Expected V23 release label in index.html")
          index_path.write_text(index_html_new,encoding="utf-8")

          deploy_path=Path(".github/workflows/deploy.yml")
          deploy=deploy_path.read_text(encoding="utf-8")
          copy_step = '''      - name: Copy Air Battle PNG assets
                shell: bash
                run: |
                  set -euo pipefail
                  mkdir -p dist/assets
                  if [ -d site/assets ]; then
                    cp -a site/assets/. dist/assets/
                  fi

          '''
          if "name: Copy Air Battle PNG assets" not in deploy:
              if deploy.count("      - name: Setup Pages") != 1:
                  raise SystemExit("Could not find unique Setup Pages step")
              deploy=deploy.replace("      - name: Setup Pages",copy_step+"      - name: Setup Pages",1)
              deploy_path.write_text(deploy,encoding="utf-8")

          licenses_path=Path("IMAGE_LICENSES.md")
          licenses=licenses_path.read_text(encoding="utf-8")
          license_note = '''
          ## Air Battle PNG sprite pack

          - site/assets/air-battle/ contains the transparent aircraft, enemy, projectile, explosion, and power-up PNGs supplied by the project owner in the site.zip archive.
          - The supplied archive did not include individual creator or license metadata. The repository records the pack as user-supplied and does not claim third-party authorship or a specific open license.
          '''
          if "## Air Battle PNG sprite pack" not in licenses:
              licenses += "\n" + license_note
              licenses_path.write_text(licenses,encoding="utf-8")

          readme_path=Path("README.md")
          readme=readme_path.read_text(encoding="utf-8")
          readme=readme.replace("Release v23","Release v24").replace("релиз v23","релиз v24").replace("релиз V23","релиз V24")
          readme_note = '''
          ### Air Battle assets (v24)

          The battle scene loads its nine aircraft and the tank, drone, projectile, explosion, and three power-up sprites from site/assets/air-battle/. The GitHub Pages workflow copies these assets into the published dist/assets/ tree.
          '''
          if "Air Battle assets (v24)" not in readme:
              readme += "\n" + readme_note
          readme_path.write_text(readme,encoding="utf-8")

          # Validate every supplied PNG before creating the release payload.
          expected_assets = [
              "site/assets/air-battle/aircraft/il-2.png",
              "site/assets/air-battle/aircraft/yak-3.png",
              "site/assets/air-battle/aircraft/mig-29.png",
              "site/assets/air-battle/aircraft/mig-31.png",
              "site/assets/air-battle/aircraft/su-25.png",
              "site/assets/air-battle/aircraft/su-27.png",
              "site/assets/air-battle/aircraft/su-34.png",
              "site/assets/air-battle/aircraft/su-35.png",
              "site/assets/air-battle/aircraft/su-57.png",
              "site/assets/air-battle/effects/bullet.png",
              "site/assets/air-battle/effects/drone.png",
              "site/assets/air-battle/effects/explosion.png",
              "site/assets/air-battle/effects/tank.png",
              "site/assets/air-battle/powerups/triple.png",
              "site/assets/air-battle/powerups/damage.png",
              "site/assets/air-battle/powerups/fire-rate.png"
          ]
          for rel in expected_assets:
              path=Path(rel)
              if not path.is_file():
                  raise SystemExit(f"Missing PNG asset: {rel}")
              data=path.read_bytes()
              if len(data)<33 or data[:8]!=bytes((137,80,78,71,13,10,26,10)):
                  raise SystemExit(f"Invalid PNG header: {rel}")
              width,height=struct.unpack(">II",data[16:24])
              color_type=data[25]
              if (width,height)!=(512,512):
                  raise SystemExit(f"Unexpected PNG size for {rel}: {width}x{height}")
              if color_type not in (4,6):
                  raise SystemExit(f"PNG lacks an alpha channel: {rel} (color type {color_type})")

          required_ids={"il-2","yak-3","mig-29","mig-31","su-25","su-27","su-34","su-35","su-57"}
          sprite_block=re.search(r"const BATTLE_SPRITES=\{(.*?)\};",html,re.S)
          stats_block=re.search(r"const BATTLE_STATS=\{(.*?)\};",html,re.S)
          catalog_start=html.find("const AIRCRAFT=[")
          catalog_end=html.find("];",catalog_start)
          if not sprite_block or not stats_block or catalog_end<0:
              raise SystemExit("One of the aircraft maps/catalog cannot be parsed")
          def ids_from(block):
              return set(re.findall(r'"([^"]+)":\{',block))
          sprite_ids=ids_from(sprite_block.group(1))
          stat_ids=ids_from(stats_block.group(1))
          catalog_ids=set(re.findall(r'id:"([^"]+)"',html[catalog_start:catalog_end]))
          if sprite_ids!=required_ids:
              raise SystemExit(f"Sprite ids mismatch: {sorted(sprite_ids)}")
          if stat_ids!=required_ids:
              raise SystemExit(f"Battle stat ids mismatch: {sorted(stat_ids)}")
          if not required_ids.issubset(catalog_ids):
              raise SystemExit(f"Aircraft catalog missing: {sorted(required_ids-catalog_ids)}")
          if '"mig-15":{' in stats_block.group(1) or '"mig-21":{' in stats_block.group(1):
              raise SystemExit("Battle stats still map supplied new PNGs to obsolete aircraft")

          if "assets/air-battle/" not in html:
              raise SystemExit("Release HTML does not reference the PNG asset directory")

          scripts=re.findall(r"<script\b[^>]*>(.*?)</script\s*>",html,re.I|re.S)
          Path("/tmp/aeroletopis-inline.js").write_text("\n;\n".join(scripts),encoding="utf-8")

          compressed=base64.b64encode(gzip.compress(html.encode("utf-8"),compresslevel=9,mtime=0)).decode("ascii")
          fixed_sizes=[len(chunk) for chunk in old_chunks[:-1]]
          last_size=len(compressed)-sum(fixed_sizes)
          if last_size<=0:
              raise SystemExit("Compressed payload no longer fits the 23-part release layout")
          sizes=fixed_sizes+[last_size]
          pos=0
          new_chunks=[]
          for size in sizes:
              new_chunks.append(compressed[pos:pos+size])
              pos+=size
          if pos!=len(compressed):
              raise SystemExit("Payload chunk split did not consume all compressed bytes")
          for path,chunk in zip(chunk_paths,new_chunks):
              path.write_text(chunk+"\n",encoding="utf-8")

          rebuilt=gzip.decompress(base64.b64decode("".join(p.read_text().strip() for p in chunk_paths),validate=True)).decode("utf-8")
          if rebuilt!=html:
              raise SystemExit("Rebuilt release differs from edited HTML")
          print(f"Updated release v24: {len(html):,} HTML characters, {len(expected_assets)} PNG assets, {len(scripts)} inline script blocks.")
          print("Aircraft IDs:",", ".join(sorted(required_ids)))
          print("Compressed archive integrity: OK")
          PY

      - name: Syntax-check the embedded site JavaScript
        run: node --check /tmp/aeroletopis-inline.js

      - name: Remove one-shot inspection and import helpers
        shell: bash
        run: |
          rm -f .github/workflows/inspect-integration.yml
          rm -f .github/workflows/inspect-airbattle.yml
          rm -f .github/workflows/import-airbattle-assets.yml

      - name: Commit v24 integration
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site index.html README.md IMAGE_LICENSES.md .github/workflows
          git commit -m "feat: integrate transparent Air Battle PNG sprites"
          git push origin HEAD:feature/knastu-sj100-airbattle
