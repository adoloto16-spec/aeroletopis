name: Inspect Air Battle restoration points
on:
  push:
    branches:
      - feature/knastu-sj100-airbattle
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Inspect release registries
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, re
          order = ["kr-01a","kr-01b","kr-02","kr-03","kr-04q1","kr-04q2","kr-04q3","kr-04q4","kr-04b","kr-05a","kr-05b","kr-06a","kr-06b","kr-07q1","kr-07q2","kr-07q3","kr-07q4","kr-07b","kr-08q1","kr-08q2","kr-08q3","kr-08q4","kr-08b"]
          payload = "".join(Path("site", n + ".b64").read_text().strip() for n in order)
          html = gzip.decompress(base64.b64decode(payload)).decode()
          print("html chars", len(html), "script tags", html.count("<script"))
          for marker in ["const AIRCRAFT=[","const BATTLE_SPRITES={","const BATTLE_STATS={","const BATTLE_ASSET_DATA={"]:
              print("\\n=== "+marker+" count="+str(html.count(marker))+" ===")
              start=0
              for _ in range(4):
                  i=html.find(marker,start)
                  if i<0: break
                  print(html[i:i+1800])
                  start=i+len(marker)
          aircraft_start=html.find("const AIRCRAFT=[")
          aircraft_end=html.find("];",aircraft_start)
          block=html[aircraft_start:aircraft_end+2] if aircraft_start>=0 and aircraft_end>=0 else ""
          print("\\nAIRCRAFT IDS:", re.findall(r'id:"([^"]+)"',block))
          for ident in ("mig-15","mig-21"):
              i=html.find('id:"'+ident+'"',aircraft_start)
              print("CATALOG",ident, (html[max(0,i-160):i+900] if i>=0 else "MISSING"))
          for marker in ["const BATTLE_ASSET_DATA={"]:
              start=0
              while True:
                  i=html.find(marker,start)
                  if i<0: break
                  end=html.find("};",i)
                  print("ASSET KEYS:",re.findall(r'"([^"]+)":"data:image/png;base64,',html[i:end]))
                  start=end+2
          PY
