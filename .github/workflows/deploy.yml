name: Deploy to GitHub Pages
# Aeroletopis branding normalization

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Normalize release branding
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, subprocess

          order = [
              "kr-01a","kr-01b","kr-02","kr-03",
              "kr-04q1","kr-04q2","kr-04q3","kr-04q4","kr-04b",
              "kr-05a","kr-05b","kr-06a","kr-06b",
              "kr-07q1","kr-07q2","kr-07q3","kr-07q4","kr-07b",
              "kr-08q1","kr-08q2","kr-08q3","kr-08q4","kr-08b"
          ]
          paths = [Path("site", name + ".b64") for name in order]
          chunks = []
          for path in paths:
              value = path.read_text(encoding="utf-8")
              if value.endswith("\\n"):
                  value = value[:-2]
              chunks.append(value.strip())
          raw = "".join(chunks)
          html = gzip.decompress(base64.b64decode(raw, validate=True)).decode("utf-8")
          if "Крылья России" not in html:
              print("Release branding already normalized")
              raise SystemExit(0)

          html = html.replace("Крылья России", "Аэролетопись")
          payload = base64.b64encode(gzip.compress(html.encode("utf-8"), compresslevel=9, mtime=1790489284)).decode("ascii")
          sizes = [len(chunk) for chunk in chunks[:-1]]
          sizes.append(len(payload) - sum(sizes))
          if sizes[-1] <= 0:
              raise SystemExit("Release payload is too short for existing chunk layout")

          pos = 0
          for path, size in zip(paths, sizes):
              path.write_text(payload[pos:pos + size] + chr(10), encoding="utf-8")
              pos += size

          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "add", "site"], check=True)
          result = subprocess.run(["git", "diff", "--cached", "--quiet"])
          if result.returncode == 0:
              print("No release chunk changes needed")
          else:
              subprocess.run(["git", "commit", "-m", "rename: normalize compressed release branding"], check=True)
              subprocess.run(["git", "push"], check=True)
              print("Compressed release chunks updated")
          PY

      - name: Rebuild release from archive chunks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import gzip

          order = [
              "kr-01a","kr-01b","kr-02","kr-03",
              "kr-04q1","kr-04q2","kr-04q3","kr-04q4","kr-04b",
              "kr-05a","kr-05b",
              "kr-06a","kr-06b",
              "kr-07q1","kr-07q2","kr-07q3","kr-07q4","kr-07b",
              "kr-08q1","kr-08q2","kr-08q3","kr-08q4","kr-08b"
          ]

          chunks = []
          for name in order:
              value = Path("site", name + ".b64").read_text(encoding="utf-8").strip()
              chunks.append(value)

          raw = "".join(chunks)
          if len(raw) != 60364:
              raise SystemExit(f"Unexpected release payload length: {len(raw)}")

          try:
              compressed = base64.b64decode(raw, validate=True)
              html = gzip.decompress(compressed).decode("utf-8")
          except Exception as exc:
              raise SystemExit(f"Release payload is invalid: {exc}")

          html = html.replace("Крылья России", "Аэролетопись")
          if len(html) != 144354:
              raise SystemExit(f"Unexpected release HTML character length after branding: {len(html)}")

          out = Path("dist")
          out.mkdir(exist_ok=True)
          (out / "index.html").write_text(html, encoding="utf-8")
          (out / ".nojekyll").write_text("", encoding="utf-8")
          print(f"Release rebuilt successfully: {len(html):,} HTML characters")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
