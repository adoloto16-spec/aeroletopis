name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Rebuild release from archive chunks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import itertools
          import string
          import zlib

          order = [
              "kr-01a","kr-01b","kr-02","kr-03",
              "kr-04q1","kr-04q2","kr-04q3","kr-04q4","kr-04b",
              "kr-05a","kr-05b",
              "kr-06a","kr-06b",
              "kr-07q1","kr-07q2","kr-07q3","kr-07q4","kr-07b",
              "kr-08q1","kr-08q2","kr-08q3","kr-08q4","kr-08b"
          ]
          expected_len = {"kr-04q1": 943, "kr-08q1": 943, "kr-08q3": 943}
          alphabet = string.ascii_letters + string.digits + "+/"

          chunks = {name: Path("site", name + ".b64").read_text(encoding="utf-8").strip() for name in order}

          def valid_gzip_prefix(names, extra_tail=16):
              raw = "".join(chunks[n] for n in names)
              idx = order.index(names[-1])
              if idx + 1 < len(order):
                  raw += chunks[order[idx + 1]][:extra_tail]
              raw += "=" * ((4 - len(raw) % 4) % 4)
              data = base64.b64decode(raw, validate=False)
              obj = zlib.decompressobj(16 + zlib.MAX_WBITS)
              obj.decompress(data)
              return True

          def repair_one(target):
              if len(chunks[target]) == expected_len[target]:
                  return

              idx = order.index(target)
              prefix_names = order[:idx]
              candidates = []
              s = chunks[target]

              for pos in range(len(s) + 1):
                  for ch in alphabet:
                      cand = s[:pos] + ch + s[pos:]
                      old = chunks[target]
                      chunks[target] = cand
                      try:
                          valid_gzip_prefix(prefix_names + [target])
                          candidates.append(cand)
                          if len(candidates) >= 32:
                              break
                      except Exception:
                          pass
                      finally:
                          chunks[target] = old
                  if len(candidates) >= 32:
                      break

              if not candidates:
                  raise SystemExit(f"Could not repair {target}")

              # Prefer a candidate that allows the complete gzip stream to decode
              # once all later source chunks are present.
              old = chunks[target]
              for cand in candidates:
                  chunks[target] = cand
                  raw = "".join(chunks[n] for n in order)
                  raw += "=" * ((4 - len(raw) % 4) % 4)
                  try:
                      gzip.decompress(base64.b64decode(raw, validate=False))
                      return
                  except Exception:
                      pass
              chunks[target] = old
              raise SystemExit(f"Could not find a complete-gzip repair for {target}")

          for target in ["kr-04q1","kr-08q1","kr-08q3"]:
              repair_one(target)

          raw = "".join(chunks[n] for n in order)
          raw += "=" * ((4 - len(raw) % 4) % 4)
          html = gzip.decompress(base64.b64decode(raw, validate=False)).decode("utf-8")

          out = Path("dist")
          out.mkdir(exist_ok=True)
          (out / "index.html").write_text(html, encoding="utf-8")
          for name in ["README.md","IMAGE_LICENSES.md"]:
              p = Path(name)
              if p.exists():
                  (out / name).write_text(p.read_text(encoding="utf-8"), encoding="utf-8")
          (out / ".nojekyll").write_text("", encoding="utf-8")
          print(f"Release rebuilt: {len(html):,} HTML characters")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
